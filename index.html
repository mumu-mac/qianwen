<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="千问" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="千问" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./qwen-app-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="image" href="./assets/img-001.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./assets/img-002.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./assets/img-009.webp" />
    <title>千问奶茶推荐</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        place-items: stretch;
        overflow: hidden;
        background: #fff;
        color: #24262b;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .app {
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #fff;
        box-shadow: none;
      }

      .app.is-loading {
        visibility: hidden;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #fff;
        transition: opacity 180ms ease;
      }

      .boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-box {
        width: min(62vw, 260px);
        text-align: center;
      }

      .boot-title {
        margin: 0 0 18px;
        color: #24262b;
        font-size: 20px;
        font-weight: 500;
        line-height: 1.2;
      }

      .boot-track {
        overflow: hidden;
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: #edf0f7;
      }

      .boot-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #286dff;
        transition: width 140ms ease;
      }

      .boot-percent {
        margin-top: 10px;
        color: #9aa0aa;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .frame-img {
        display: block;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      .top-shell {
        position: relative;
        flex: 0 0 auto;
      }

      .top-back-hit {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 3;
        width: 18%;
        height: 100%;
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 26px 16px;
        background: #fff;
        scrollbar-width: none;
      }

      .content::-webkit-scrollbar,
      .cards::-webkit-scrollbar {
        display: none;
      }

      .answer {
        margin: 0 0 10px;
        color: #303750;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.55;
      }

      .cards {
        display: flex;
        gap: 14px;
        margin: 0 -26px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        padding: 0 26px 12px;
        scroll-padding-left: 26px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .card {
        flex: 0 0 100%;
        overflow: hidden;
        border: 1px solid #eceef7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(33, 43, 70, 0.1);
        scroll-snap-align: start;
      }

      .shop {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 13px 14px 7px;
      }

      .logo {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #eef0f5;
      }

      .logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        color: #26304c;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.2;
      }

      .meta {
        margin: 6px 0 0;
        color: #737b8f;
        font-size: 12px;
        font-weight: 400;
      }

      .distance {
        color: #6f7cff;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.35;
        text-align: right;
        white-space: nowrap;
      }

      .desc {
        margin: 0;
        padding: 0 14px 10px 58px;
        color: #424a63;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.45;
      }

      .goods {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 8px;
        padding: 0 14px 11px;
      }

      .photo {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid #eef0f5;
        border-radius: 9px;
        background: #f7f8fb;
      }

      .photo-sprite {
        background-image: var(--board-image);
        background-repeat: no-repeat;
        background-size: 300% 200%;
      }

      .product-slot-0 {
        background-position: 0% 0%;
      }

      .product-slot-1 {
        background-position: 50% 0%;
      }

      .product-slot-2 {
        background-position: 100% 0%;
      }

      .product-slot-3 {
        background-position: 0% 100%;
      }

      .product-slot-4 {
        background-position: 50% 100%;
      }

      .product-slot-5 {
        background-position: 100% 100%;
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo::after {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: #83c454;
        color: #fff;
        content: "券";
        font-size: 10px;
        font-weight: 800;
        line-height: 18px;
        text-align: center;
      }

      .tag {
        position: absolute;
        bottom: 7px;
        left: 7px;
        max-width: calc(100% - 14px);
        overflow: hidden;
        padding: 3px 5px;
        border-radius: 999px;
        background: rgba(20, 23, 36, 0.74);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .price {
        display: grid;
        gap: 3px;
        margin-top: 5px;
        line-height: 1.2;
      }

      .deal-line {
        display: flex;
        align-items: baseline;
        gap: 3px;
        color: #ff2d2f;
        white-space: nowrap;
      }

      .deal-line strong {
        color: #ff2d2f;
        font-size: 12px;
        font-weight: 600;
      }

      .deal-label {
        font-size: 10px;
        font-weight: 500;
      }

      .saving-line {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        align-items: center;
        overflow: hidden;
        padding: 1px 3px;
        border: 1px solid rgba(255, 45, 47, 0.32);
        border-radius: 5px;
        color: #ff2d2f;
        font-size: 8.5px;
        font-weight: 400;
        white-space: nowrap;
      }

      .price .original {
        color: #a2a7b2;
        font-size: 12px;
        font-weight: 400;
        text-decoration: line-through;
      }

      .saving-line .original {
        font-size: inherit;
      }

      .action {
        display: block;
        width: calc(100% - 28px);
        height: 40px;
        margin: 0 14px 13px;
        border: 0;
        border-radius: 12px;
        background: #91a5ff;
        color: #142257;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }

      .copy {
        margin: 0;
        color: #36405b;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.6;
      }

      .copy + .copy {
        margin-top: 10px;
      }

      .recommend-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
        padding-bottom: 8px;
      }

      .rec-title {
        margin: 0 0 5px;
        color: #252a3a;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
      }

      .rec-body {
        margin: 0;
        color: #36405b;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.62;
      }

      .rec-note {
        margin: 5px 0 0;
        color: #6c7280;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.5;
      }

      .back {
        display: inline-flex;
        align-items: center;
        height: 32px;
        margin: 0 0 10px;
        padding: 0 12px;
        border: 1px solid #e7e8ee;
        border-radius: 12px;
        background: #fff;
        color: #343946;
        font-size: 13px;
        font-weight: 400;
        cursor: pointer;
      }

      .detail-card {
        overflow: hidden;
        margin-bottom: 12px;
        border: 1px solid #eceef7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(33, 43, 70, 0.1);
      }

      .section-title {
        margin: 0;
        padding: 0 14px 10px;
        color: #28304a;
        font-size: 14px;
        font-weight: 500;
      }


      .welcome {
        padding-top: clamp(118px, 18vh, 154px);
      }

      .welcome-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .welcome-avatar {
        display: block;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        border-radius: 50%;
        object-fit: cover;
      }

      .welcome-title {
        margin: 0;
        color: #c4c9ef;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .welcome-subtitle {
        margin: 18px 0 0;
        color: #a8afbe;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.45;
      }

      .welcome-prompts {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin-top: 46px;
      }

      .welcome-chip {
        display: inline-flex;
        align-items: center;
        min-height: 39px;
        max-width: 100%;
        padding: 0 13px;
        border: 1px solid #ececef;
        border-radius: 14px;
        background: #fff;
        color: #25262a;
        box-shadow: 0 1px 2px rgba(30, 35, 48, 0.02);
        font: inherit;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.25;
        text-align: left;
        cursor: pointer;
      }

      .reward {
        padding-top: clamp(38px, 6.5vh, 58px);
      }

      .reward-user {
        display: flex;
        justify-content: flex-end;
      }

      .reward-bubble {
        min-width: 106px;
        max-width: 210px;
        padding: 15px 22px;
        border-radius: 20px;
        background: #d8efff;
        color: #24262b;
        font-size: 19px;
        font-weight: 400;
        line-height: 1.25;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .reward-card {
        margin-top: 20px;
        padding: 18px 14px 16px;
        border-radius: 18px;
        background: #f6f6f6;
      }

      .reward-text {
        margin: 0;
        color: #24262b;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.55;
      }

      .coupon {
        margin-top: 18px;
        overflow: hidden;
        border-radius: 8px;
        background: #fff;
      }

      .coupon-main {
        display: grid;
        grid-template-columns: 54px 1fr auto;
        gap: 13px;
        align-items: center;
        padding: 15px 13px 12px;
      }

      .packet {
        position: relative;
        width: 46px;
        height: 58px;
        border-radius: 8px;
        background: linear-gradient(145deg, #ff3535 0%, #ff1f27 60%, #ff562e 100%);
        box-shadow: inset 0 9px 14px rgba(255, 255, 255, 0.08);
      }

      .packet::before {
        position: absolute;
        right: 0;
        bottom: 14px;
        left: 0;
        height: 2px;
        background: #ffe7b7;
        content: "";
      }

      .packet::after {
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffe19a;
        color: #ffbd42;
        content: "★";
        font-size: 10px;
        line-height: 20px;
        text-align: center;
        transform: translateX(-50%);
      }

      .coupon-title {
        margin: 0 0 7px;
        color: #24262b;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.2;
      }

      .coupon-sub {
        margin: 0;
        color: #737373;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
        white-space: nowrap;
      }

      .coupon-badge {
        display: inline-flex;
        align-items: center;
        height: 17px;
        margin-right: 4px;
        padding: 0 4px;
        border-radius: 4px;
        background: #854a32;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        vertical-align: 1px;
      }

      .claim {
        min-width: 68px;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: #ffe8bf;
        color: #aa4700;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .coupon-foot {
        display: flex;
        justify-content: space-between;
        margin: 0 13px;
        padding: 11px 0 12px;
        border-top: 1px dashed #c9c0b8;
        color: #707070;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .reward-tools {
        display: flex;
        gap: 20px;
        margin: 16px 0 0 12px;
        color: #6b6b6b;
        font-size: 20px;
        line-height: 1;
      }

      .reward-asset-wrap {
        position: relative;
        margin-top: 18px;
      }

      .reward-asset {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      .claim-hit {
        position: absolute;
        top: 47.8%;
        left: 72%;
        width: 19%;
        height: 12%;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .reward-countdown {
        position: absolute;
        top: 70.55%;
        left: 9.3%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 11%;
        height: 4.8%;
        background: transparent;
        color: #6f6f6f;
        font-size: 9px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      .bottom-shell {
        position: relative;
        flex: 0 0 auto;
      }

      .bottom-shell::before {
        content: "";
        position: absolute;
        top: 24%;
        right: 0;
        left: 0;
        height: 74.5%;
        background: url("./assets/composer-typing.webp") center / 100% 100% no-repeat;
        opacity: 0;
        pointer-events: none;
        z-index: 1;
      }

      .bottom-shell.is-typing::before {
        opacity: 1;
      }

      .composer-form {
        position: absolute;
        top: 48.8%;
        right: 31.5%;
        left: 16%;
        height: 22%;
        display: flex;
        align-items: center;
        z-index: 2;
      }

      .bottom-shell.is-typing .composer-form {
        top: 40%;
        right: 17%;
        left: 7%;
        height: 20%;
      }

      .composer-input {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 4px;
        outline: 0;
        background: transparent;
        color: #3a3d45;
        font-family: inherit;
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
      }

      .bottom-shell.is-typing .composer-input {
        background: transparent;
      }

      .send-hit {
        position: absolute;
        top: 61%;
        right: 3.8%;
        z-index: 3;
        display: none;
        width: 12%;
        height: 26%;
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .bottom-shell.is-typing .send-hit {
        display: block;
      }

      @media (max-width: 430px) {
        body {
          display: block;
          background: #fff;
        }

        .app {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          box-shadow: none;
        }

        .content {
          padding-right: 7.1vw;
          padding-left: 7.1vw;
        }

        .cards {
          margin-right: -7.1vw;
          margin-left: -7.1vw;
          padding-right: 7.1vw;
          padding-left: 7.1vw;
          scroll-padding-left: 7.1vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-loader" id="boot-loader" role="status" aria-live="polite">
      <div class="boot-box">
        <p class="boot-title">千问</p>
        <div class="boot-track" aria-hidden="true">
          <div class="boot-bar" id="boot-bar"></div>
        </div>
        <p class="boot-percent" id="boot-percent">正在加载 0%</p>
      </div>
    </div>

    <main class="app is-loading" id="app" aria-label="千问手机页面" aria-hidden="true">
      <div class="top-shell">
        <img class="frame-img" src="assets/img-001.webp" alt="" />
        <button class="top-back-hit" id="top-back-hit" type="button" aria-label="返回第一幕"></button>
      </div>

      <section class="content" id="content" aria-label="奶茶推荐内容"></section>

      <div class="bottom-shell">
      <img class="frame-img" src="assets/img-002.webp" alt="" />
        <form class="composer-form" id="composer-form" autocomplete="off">
          <input class="composer-input" id="composer-input" type="text" aria-label="输入消息" enterkeyhint="send" />
        </form>
        <button class="send-hit" type="submit" form="composer-form" aria-label="发送"></button>
      </div>
    </main>

          logoUrl: "assets/logo-shuyi.webp",
          products: [
            { name: "一桶大西瓜椰椰", originalPrice: "19", save: "18.99" },
            { name: "一桶大牛奶烧仙草", originalPrice: "19", save: "18.99" },
            { name: "一桶大爆有料烧仙草", originalPrice: "19", save: "18.99" },
            { name: "一桶大脆啵啵手捣鲜橙", originalPrice: "18", save: "17.99" },
            { name: "脆啵啵鲜榨西瓜", originalPrice: "12", save: "11.99" },
            { name: "西红柿蛋花汤", originalPrice: "15", save: "14.99" }
          ],
          boardImage: "assets/product-board-shuyi.webp"
        }
      ];

      const app = document.querySelector("#app");
      const content = document.querySelector("#content");
      const composerForm = document.querySelector("#composer-form");
      const composerInput = document.querySelector("#composer-input");
      const bottomShell = document.querySelector(".bottom-shell");
      const topBackHit = document.querySelector("#top-back-hit");
      const bootLoader = document.querySelector("#boot-loader");
      const bootBar = document.querySelector("#boot-bar");
      const bootPercent = document.querySelector("#boot-percent");
      const rewardImage = "assets/img-009.webp";
      const avatarImage = "assets/img-010.webp";
      let lastQuery = "奶茶";
      let inputTimer;
      let rewardTimer;
      const branchPool = [
        { city: "上海", road: "南京西路" },
        { city: "北京", road: "建国路" },
        { city: "广州", road: "北京路" },
        { city: "深圳", road: "深南中路" },
        { city: "杭州", road: "延安路" },
        { city: "成都", road: "春熙路" },
        { city: "重庆", road: "民族路" },
        { city: "武汉", road: "江汉路" },
        { city: "南京", road: "中山路" },
        { city: "西安", road: "小寨东路" }
      ];

      function shuffledCopy(items) {
        return items
          .map((item) => ({ item, rank: Math.random() }))
          .sort((a, b) => a.rank - b.rank)
          .map((entry) => entry.item);
      }

      const initialBranches = shuffledCopy(branchPool);
      const storesWithBranches = stores.map((store, index) => {
        const branch = initialBranches[index % initialBranches.length];
        return {
          ...store,
          displayName: `${store.name}（${branch.road}店）`
        };
      });

      function randomizedStores() {
        return storesWithBranches;
      }


      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      const recommendationPool = [
        {
          title: "今日首选：伯牙绝弦（茉莉鲜牛乳）",
          body: "霸王茶姬同款逻辑，茉莉雪芽加鲜牛乳，茶香清雅、不甜腻，适合不想喝太厚但又想来点奶香的人。",
          note: "推荐设定：热饮 / 三分糖 / 不加料"
        },
        {
          title: "🥇 经典永驻：黑糖珍珠鲜奶",
          body: "台式珍珠奶茶变体，蜜雪冰城、CoCo、古茗全线在售。黑糖挂壁加 Q 弹珍珠加全脂鲜奶，嚼感拉满，打工续命首选。",
          note: "推荐设定：少冰 / 五分糖 / 珍珠多加"
        },
        {
          title: "🥥 夏日延续款：生椰拿铁奶茶 / 椰乳奶茶",
          body: "椰乳替牛奶，热带清甜不腻口，喜茶椰椰系、瑞幸生椰线、古茗生椰抹茶都属这类，夏天尾巴喝也不违和。"
        },
        {
          title: "🍇 果茶党专属：多肉葡萄 / 芝士葡萄",
          body: "现剥葡萄加绿茶底加芝士奶盖，喜茶和古茗的热门逻辑，酸甜解腻，配晚饭或火锅都很合适。"
        },
        {
          title: "🍠 饱腹治愈系：厚芋泥波波奶茶",
          body: "沪上阿姨、茶百道常驻款，绵密芋泥加波波加牛乳，一口顶半顿夜宵，适合想喝点东西顺便垫肚子。"
        },
        {
          title: "🍵 茶底控备选：芝士奶盖四季春 / 益禾烤奶",
          body: "奶盖咸甜挂选前者，蜜雪和喜茶都有类似逻辑；焦糖烤香选后者，属于益禾堂平价爆款路线。"
        }
      ];

      function recommendationCopy(query) {
        const picks = shuffledCopy(recommendationPool).slice(0, 3);
        return `
          <p class="copy">嗨～看到您回来太开心啦！千问识别到【${escapeHtml(query)}】已为您匹配了“新人回归礼包”，里面优先放了蜜雪冰城、茶百道、沪上阿姨、霸王茶姬、书亦烧仙草的福利，快去看看吧！</p>
          <div class="recommend-list">
            ${picks.map((item) => `
              <section>
                <h2 class="rec-title">${item.title}</h2>
                <p class="rec-body">${item.body}</p>
                ${item.note ? `<p class="rec-note">${item.note}</p>` : ""}
              </section>
            `).join("")}
          </div>
        `;
      }



      function stopRewardCountdown() {
        if (rewardTimer) {
          clearInterval(rewardTimer);
          rewardTimer = null;
        }
      }

      function formatRewardTime(totalSeconds) {
        const safeSeconds = Math.max(0, totalSeconds);
        const hours = String(Math.floor(safeSeconds / 3600)).padStart(2, "0");
        const minutes = String(Math.floor((safeSeconds % 3600) / 60)).padStart(2, "0");
        const seconds = String(safeSeconds % 60).padStart(2, "0");
        return `${hours}:${minutes}:${seconds}`;
      }

      function startRewardCountdown() {
        stopRewardCountdown();
        let remaining = 24 * 3600;
        const countdown = content.querySelector("#reward-countdown");
        const tick = () => {
          if (!countdown) return;
          countdown.textContent = formatRewardTime(remaining);
          remaining = Math.max(0, remaining - 1);
        };
        tick();
        rewardTimer = setInterval(tick, 1000);
      }

      function productGrid(store) {
        return store.products.slice(0, 6).map((product, index) => `
            <div>
              <div class="photo photo-sprite product-slot-${index}"><span class="tag">${product.name}</span></div>
              <div class="price">
                <div class="deal-line"><strong>￥0.01</strong><span class="deal-label">一口价</span></div>
                <div class="saving-line"><span>立省￥${product.save}</span><span>｜</span><span class="original">原价￥${product.originalPrice}</span></div>
              </div>
            </div>
          `).join("");
      }

      function productNames(store, count) {
        return store.products.slice(0, count).map((product) => product.name).join("、");
      }

      function storeCard(store, index) {
        const storeName = store.displayName || store.name;
        return `
          <article class="card">
            <div class="shop">
              <div class="logo"><img src="${store.logoUrl}" alt="${storeName} logo" loading="lazy" decoding="async" fetchpriority="low" /></div>
              <div>
                <h1>${storeName}</h1>
                <p class="meta">热门产品 · 活动可选</p>
              </div>
              <div class="distance">附近<br />可选购</div>
            </div>
            <p class="desc">${storeName} 的热门单品包含 ${productNames(store, 4)}，适合先看口味和价格，再进店下单。</p>
            <div class="goods" style="--board-image: url('${store.boardImage}')">${productGrid(store)}</div>
            <button class="action" type="button">进店选购</button>
          </article>
        `;
      }

      function renderWelcome() {
        stopRewardCountdown();
        composerInput.value = "";
        bottomShell.classList.remove("is-typing");
        content.scrollTop = 0;
        content.innerHTML = `
          <div class="welcome">
            <div class="welcome-head">
              <img class="welcome-avatar" src="${avatarImage}" alt="千问头像" />
              <h1 class="welcome-title">我是千问</h1>
            </div>
            <p class="welcome-subtitle">为你答疑 办事 创作，随时找我聊天</p>
            <div class="welcome-prompts" aria-label="示例问题">
              <button class="welcome-chip" type="button" data-query="怎么用 AI 快速提升收入？">怎么用 AI 快速提升收入？</button>
              <button class="welcome-chip" type="button" data-query="大数据时代，如何打破信息茧房？">大数据时代，如何打破信息茧房？</button>
              <button class="welcome-chip" type="button" data-query="怎么让自己更自律？">怎么让自己更自律？</button>
            </div>
          </div>
        `;

        content.querySelectorAll("[data-query]").forEach((button) => {
          button.addEventListener("click", () => showTeaResults(button.dataset.query));
        });
      }

      function showTeaResults(query) {
        const nextQuery = query.trim() || "奶茶";
        lastQuery = nextQuery;
        composerInput.value = "";
        composerInput.blur();
        bottomShell.classList.remove("is-typing");
        renderReward(nextQuery);
      }

      function renderReward(query = lastQuery) {
        stopRewardCountdown();
        const safeQuery = escapeHtml(query);
        content.scrollTop = 0;
        content.innerHTML = `
          <div class="reward">
            <div class="reward-user">
              <div class="reward-bubble">${safeQuery}</div>
            </div>
            <div class="reward-asset-wrap">
              <img class="reward-asset" src="${rewardImage}" alt="千问专属福利" />
              <span class="reward-countdown" id="reward-countdown">24:00:00</span>
              <button class="claim-hit" type="button" aria-label="立即领取"></button>
            </div>
          </div>
        `;

        startRewardCountdown();
        content.querySelector(".claim-hit").addEventListener("click", () => renderList(lastQuery));
      }

      function renderList(query = lastQuery) {
        stopRewardCountdown();
        const displayStores = randomizedStores();
        content.scrollTop = 0;
        content.innerHTML = `
          <p class="answer">已为你找到附近的奶茶店热门商品：</p>
          <div class="cards" aria-label="可左右滑动的奶茶店卡片">
            ${displayStores.map(storeCard).join("")}
          </div>
          ${recommendationCopy(query)}
        `;

      }

      function renderDetail(index) {
        stopRewardCountdown();
        const store = stores[index];
        content.scrollTop = 0;
        content.innerHTML = `
          <button class="back" type="button">返回推荐</button>
          <article class="detail-card">
            <div class="shop">
              <div class="logo"><img src="${store.logoUrl}" alt="${store.name} logo" loading="lazy" decoding="async" fetchpriority="low" /></div>
              <div>
                <h1>${store.name}</h1>
                <p class="meta">店铺详情 · 活动可选</p>
              </div>
              <div class="distance">附近<br />可选购</div>
            </div>
            <p class="desc">${store.name} 当前展示 ${productNames(store, 6)}。你可以先对比口味和原价，再结合 ￥0.01 一口价选择想喝的单品。</p>
            <p class="section-title">热门产品</p>
            <div class="goods" style="--board-image: url('${store.boardImage}')">${productGrid(store)}</div>
            <button class="action" type="button">进店选购</button>
          </article>
          <p class="copy">如果想喝清爽型，优先看果茶、柠檬茶、轻乳茶；如果想喝浓郁型，优先看鲜奶茶、厚乳、芋泥、烧仙草和波波类。</p>
          <p class="copy">AI 建议：先选一杯价格差明显、口味接受度高的招牌款，再看是否需要加料或换成大杯。</p>
        `;

        content.querySelector(".back").addEventListener("click", () => renderList(lastQuery));
      }

      function sendComposerMessage() {
        const value = composerInput.value.trim();
        if (!value) return;
        clearTimeout(inputTimer);
        showTeaResults(value);
      }

      function getBootAssets() {
        return [...new Set([
          "assets/img-001.webp",
          "assets/img-002.webp",
          rewardImage,
          avatarImage,
          "qwen-app-icon.png",
          "apple-touch-icon.png",
          "assets/composer-typing.webp",
          ...stores.flatMap((store) => [store.logoUrl, store.boardImage])
        ])];
      }

      function updateBootProgress(done, total) {
        const percent = total ? Math.round((done / total) * 100) : 100;
        bootBar.style.width = `${percent}%`;
        bootPercent.textContent = `正在加载 ${percent}%`;
      }

      function loadBootImage(url) {
        return new Promise((resolve) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => {
            if (!image.decode) {
              resolve(url);
              return;
            }
            image.decode().then(() => resolve(url)).catch(() => resolve(url));
          };
          image.onerror = () => resolve(url);
          image.src = url;
        });
      }

      function preloadBootAssets() {
        const assets = getBootAssets();
        let loaded = 0;
        updateBootProgress(0, assets.length);

        return Promise.all(assets.map((url) =>
          loadBootImage(url).then(() => {
            loaded += 1;
            updateBootProgress(loaded, assets.length);
          })
        ));
      }

      function finishBoot() {
        renderWelcome();
        app.classList.remove("is-loading");
        app.removeAttribute("aria-hidden");
        bootLoader.classList.add("is-hidden");
        setTimeout(() => {
          bootLoader.hidden = true;
        }, 220);
      }

      function bootApp() {
        preloadBootAssets().then(finishBoot);
      }

      function registerFastCache() {
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }

      topBackHit.addEventListener("click", () => {
        clearTimeout(inputTimer);
        composerInput.value = "";
        composerInput.blur();
        renderWelcome();
      });

      composerInput.addEventListener("focus", () => bottomShell.classList.add("is-typing"));
      composerInput.addEventListener("blur", () => {
        if (!composerInput.value.trim()) bottomShell.classList.remove("is-typing");
      });
      composerInput.addEventListener("input", () => {
        clearTimeout(inputTimer);
        bottomShell.classList.add("is-typing");
      });
      composerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        sendComposerMessage();
      });

      bootApp();
      registerFastCache();
    </script>
  </body>
</html>
