<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="千问" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="千问" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./qwen-app-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>千问奶茶推荐</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: stretch;
        overflow: hidden;
        background: #fff;
        color: #24262b;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #fff;
        box-shadow: none;
      }

      .frame-img {
        display: block;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 26px 16px;
        background: #fff;
        scrollbar-width: none;
      }

      .content::-webkit-scrollbar,
      .cards::-webkit-scrollbar {
        display: none;
      }

      .answer {
        margin: 0 0 10px;
        color: #303750;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.55;
      }

      .cards {
        display: flex;
        gap: 14px;
        margin: 0 -26px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        padding: 0 26px 12px;
        scroll-padding-left: 26px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .card {
        flex: 0 0 100%;
        overflow: hidden;
        border: 1px solid #eceef7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(33, 43, 70, 0.1);
        scroll-snap-align: start;
      }

      .shop {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 13px 14px 7px;
      }

      .logo {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #eef0f5;
      }

      .logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        color: #26304c;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.2;
      }

      .meta {
        margin: 6px 0 0;
        color: #737b8f;
        font-size: 12px;
        font-weight: 400;
      }

      .distance {
        color: #6f7cff;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.35;
        text-align: right;
        white-space: nowrap;
      }

      .desc {
        margin: 0;
        padding: 0 14px 10px 58px;
        color: #424a63;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.45;
      }

      .goods {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 8px;
        padding: 0 14px 11px;
      }

      .photo {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid #eef0f5;
        border-radius: 9px;
        background: #f7f8fb;
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo::after {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: #83c454;
        color: #fff;
        content: "券";
        font-size: 10px;
        font-weight: 800;
        line-height: 18px;
        text-align: center;
      }

      .tag {
        position: absolute;
        bottom: 7px;
        left: 7px;
        max-width: calc(100% - 14px);
        overflow: hidden;
        padding: 3px 5px;
        border-radius: 999px;
        background: rgba(20, 23, 36, 0.74);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .price {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin-top: 5px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .price .original {
        color: #a2a7b2;
        font-size: 9px;
        font-weight: 400;
        text-decoration: line-through;
      }

      .price strong {
        color: #ff2d2f;
        font-size: 12px;
        font-weight: 600;
      }

      .action {
        display: block;
        width: calc(100% - 28px);
        height: 40px;
        margin: 0 14px 13px;
        border: 0;
        border-radius: 12px;
        background: #91a5ff;
        color: #142257;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }

      .copy {
        margin: 0;
        color: #36405b;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.6;
      }

      .copy + .copy {
        margin-top: 10px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        height: 32px;
        margin: 0 0 10px;
        padding: 0 12px;
        border: 1px solid #e7e8ee;
        border-radius: 12px;
        background: #fff;
        color: #343946;
        font-size: 13px;
        font-weight: 400;
        cursor: pointer;
      }

      .detail-card {
        overflow: hidden;
        margin-bottom: 12px;
        border: 1px solid #eceef7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(33, 43, 70, 0.1);
      }

      .section-title {
        margin: 0;
        padding: 0 14px 10px;
        color: #28304a;
        font-size: 14px;
        font-weight: 500;
      }


      .welcome {
        padding-top: clamp(118px, 18vh, 154px);
      }

      .welcome-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .welcome-avatar {
        display: block;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        border-radius: 50%;
        object-fit: cover;
      }

      .welcome-title {
        margin: 0;
        color: #c4c9ef;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .welcome-subtitle {
        margin: 18px 0 0;
        color: #a8afbe;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.45;
      }

      .welcome-prompts {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin-top: 46px;
      }

      .welcome-chip {
        display: inline-flex;
        align-items: center;
        min-height: 39px;
        max-width: 100%;
        padding: 0 13px;
        border: 1px solid #ececef;
        border-radius: 14px;
        background: #fff;
        color: #25262a;
        box-shadow: 0 1px 2px rgba(30, 35, 48, 0.02);
        font: inherit;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.25;
        text-align: left;
        cursor: pointer;
      }

      .reward {
        padding-top: clamp(38px, 6.5vh, 58px);
      }

      .reward-user {
        display: flex;
        justify-content: flex-end;
      }

      .reward-bubble {
        min-width: 106px;
        max-width: 210px;
        padding: 15px 22px;
        border-radius: 20px;
        background: #d8efff;
        color: #24262b;
        font-size: 19px;
        font-weight: 400;
        line-height: 1.25;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .reward-card {
        margin-top: 20px;
        padding: 18px 14px 16px;
        border-radius: 18px;
        background: #f6f6f6;
      }

      .reward-text {
        margin: 0;
        color: #24262b;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.55;
      }

      .coupon {
        margin-top: 18px;
        overflow: hidden;
        border-radius: 8px;
        background: #fff;
      }

      .coupon-main {
        display: grid;
        grid-template-columns: 54px 1fr auto;
        gap: 13px;
        align-items: center;
        padding: 15px 13px 12px;
      }

      .packet {
        position: relative;
        width: 46px;
        height: 58px;
        border-radius: 8px;
        background: linear-gradient(145deg, #ff3535 0%, #ff1f27 60%, #ff562e 100%);
        box-shadow: inset 0 9px 14px rgba(255, 255, 255, 0.08);
      }

      .packet::before {
        position: absolute;
        right: 0;
        bottom: 14px;
        left: 0;
        height: 2px;
        background: #ffe7b7;
        content: "";
      }

      .packet::after {
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffe19a;
        color: #ffbd42;
        content: "★";
        font-size: 10px;
        line-height: 20px;
        text-align: center;
        transform: translateX(-50%);
      }

      .coupon-title {
        margin: 0 0 7px;
        color: #24262b;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.2;
      }

      .coupon-sub {
        margin: 0;
        color: #737373;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
        white-space: nowrap;
      }

      .coupon-badge {
        display: inline-flex;
        align-items: center;
        height: 17px;
        margin-right: 4px;
        padding: 0 4px;
        border-radius: 4px;
        background: #854a32;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        vertical-align: 1px;
      }

      .claim {
        min-width: 68px;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: #ffe8bf;
        color: #aa4700;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .coupon-foot {
        display: flex;
        justify-content: space-between;
        margin: 0 13px;
        padding: 11px 0 12px;
        border-top: 1px dashed #c9c0b8;
        color: #707070;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .reward-tools {
        display: flex;
        gap: 20px;
        margin: 16px 0 0 12px;
        color: #6b6b6b;
        font-size: 20px;
        line-height: 1;
      }

      .reward-asset-wrap {
        position: relative;
        margin-top: 18px;
      }

      .reward-asset {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      .claim-hit {
        position: absolute;
        top: 47.8%;
        left: 72%;
        width: 19%;
        height: 12%;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .reward-countdown {
        position: absolute;
        top: 70.55%;
        left: 10.2%;
        display: flex;
        align-items: center;
        width: 12%;
        height: 4.8%;
        background: #fff;
        color: #6f6f6f;
        font-size: 10px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      .bottom-shell {
        position: relative;
        flex: 0 0 auto;
      }

      .bottom-shell::before {
        content: "";
        position: absolute;
        top: 48.8%;
        right: 31.5%;
        left: 16%;
        height: 22%;
        border-radius: 8px;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }

      .bottom-shell.is-typing::before {
        opacity: 1;
      }

      .composer-form {
        position: absolute;
        top: 48.8%;
        right: 31.5%;
        left: 16%;
        height: 22%;
        display: flex;
        align-items: center;
        z-index: 2;
      }

      .composer-input {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 4px;
        outline: 0;
        background: transparent;
        color: #3a3d45;
        font-family: inherit;
        font-size: 15px;
        font-weight: 400;
        line-height: 1;
      }

      .bottom-shell.is-typing .composer-input {
        background: transparent;
      }

      @media (max-width: 430px) {
        body {
          display: block;
          background: #fff;
        }

        .app {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          box-shadow: none;
        }

        .content {
          padding-right: 7.1vw;
          padding-left: 7.1vw;
        }

        .cards {
          margin-right: -7.1vw;
          margin-left: -7.1vw;
          padding-right: 7.1vw;
          padding-left: 7.1vw;
          scroll-padding-left: 7.1vw;
        }
      }
    </style>
  </head>

          <input class="composer-input" id="composer-input" type="text" aria-label="输入消息" />

      </div>
    </main>

      const content = document.querySelector("#content");
      const composerForm = document.querySelector("#composer-form");
      const composerInput = document.querySelector("#composer-input");
      const bottomShell = document.querySelector(".bottom-shell");
      const rewardImage = "assets/img-352.webp";
      const avatarImage = "assets/img-353.webp";
      let lastQuery = "奶茶";
      let inputTimer;
      let rewardTimer;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }



      function stopRewardCountdown() {
        if (rewardTimer) {
          clearInterval(rewardTimer);
          rewardTimer = null;
        }
      }

      function formatRewardTime(totalSeconds) {
        const safeSeconds = Math.max(0, totalSeconds);
        const hours = String(Math.floor(safeSeconds / 3600)).padStart(2, "0");
        const minutes = String(Math.floor((safeSeconds % 3600) / 60)).padStart(2, "0");
        const seconds = String(safeSeconds % 60).padStart(2, "0");
        return `${hours}:${minutes}:${seconds}`;
      }

      function startRewardCountdown() {
        stopRewardCountdown();
        let remaining = 21 * 3600 + 42 * 60 + 28;
        const countdown = content.querySelector("#reward-countdown");
        const tick = () => {
          if (!countdown) return;
          countdown.textContent = formatRewardTime(remaining);
          remaining = Math.max(0, remaining - 1);
        };
        tick();
        rewardTimer = setInterval(tick, 1000);
      }

      function productGrid(store) {
        return store.products.slice(0, 6).map((product) => `
            <div>
              <div class="photo"><img src="${product.image}" alt="${product.name}" loading="eager" decoding="async" /><span class="tag">${product.name}</span></div>
              <div class="price"><span class="original">￥${product.price}</span><strong>￥0.1</strong></div>
            </div>
          `).join("");
      }

      function productNames(store, count) {
        return store.products.slice(0, count).map((product) => product.name).join("、");
      }

      function storeCard(store, index) {
        return `
          <article class="card">
            <div class="shop">
              <div class="logo"><img src="${store.logoUrl}" alt="${store.name} logo" loading="eager" decoding="async" /></div>
              <div>
                <h1>${store.name}</h1>
                <p class="meta">热门产品 · 活动可选</p>
              </div>
              <div class="distance">附近<br />可选购</div>
            </div>
            <p class="desc">${store.name} 的热门单品包含 ${productNames(store, 4)}，适合先看口味和价格，再进店下单。</p>
            <div class="goods">${productGrid(store)}</div>
            <button class="action" type="button" data-shop="${index}">进店选购</button>
          </article>
        `;
      }

      function renderWelcome() {
        stopRewardCountdown();
        composerInput.value = "";
        bottomShell.classList.remove("is-typing");
        content.scrollTop = 0;
        content.innerHTML = `
          <div class="welcome">
            <div class="welcome-head">
              <img class="welcome-avatar" src="${avatarImage}" alt="千问头像" />
              <h1 class="welcome-title">我是千问</h1>

            <p class="welcome-subtitle">为你答疑 办事 创作，随时找我聊天</p>

              <button class="welcome-chip" type="button" data-query="大数据时代，如何打破信息茧房？">大数据时代，如何打破信息茧房？</button>

            </div>
          </div>
        `;

        content.querySelectorAll("[data-query]").forEach((button) => {
          button.addEventListener("click", () => showTeaResults(button.dataset.query));

      }

      function showTeaResults(query) {
        const nextQuery = query.trim() || "奶茶";
        lastQuery = nextQuery;
        composerInput.value = "";
        bottomShell.classList.add("is-typing");
        renderReward(nextQuery);
      }

      function renderReward(query = lastQuery) {
        stopRewardCountdown();
        const safeQuery = escapeHtml(query);
        content.scrollTop = 0;
        content.innerHTML = `
          <div class="reward">
            <div class="reward-user">
              <div class="reward-bubble">${safeQuery}</div>
            </div>
            <div class="reward-asset-wrap">
              <img class="reward-asset" src="${rewardImage}" alt="千问专属福利" />
              <span class="reward-countdown" id="reward-countdown">21:42:28</span>
              <button class="claim-hit" type="button" aria-label="立即领取"></button>
            </div>
          </div>
        `;

        startRewardCountdown();
        content.querySelector(".claim-hit").addEventListener("click", () => renderList(lastQuery));
      }

      function renderList(query = lastQuery) {
        stopRewardCountdown();
        content.scrollTop = 0;
        content.innerHTML = `
          <p class="answer">已为你找到附近的奶茶店热门商品：</p>
          <div class="cards" aria-label="可左右滑动的奶茶店卡片">
            ${stores.map(storeCard).join("")}
          </div>
          <p class="copy">AI 分析：结合“${escapeHtml(query)}”这个需求，基础款优先看蜜雪冰城、甜啦啦、幸运咖；想要茶香和口味层次，可以先看霸王茶姬、喜茶、奈雪和茶颜悦色。</p>
          <p class="copy">清爽型优先看柠檬茶、果茶、轻乳茶；浓郁型优先看鲜奶茶、厚乳、芋泥、烧仙草和波波类。</p>
        `;

        content.querySelectorAll("[data-shop]").forEach((button) => {
          button.addEventListener("click", () => renderDetail(Number(button.dataset.shop)));
        });
      }

      function renderDetail(index) {
        stopRewardCountdown();
        const store = stores[index];
        content.scrollTop = 0;
        content.innerHTML = `
          <button class="back" type="button">返回推荐</button>
          <article class="detail-card">
            <div class="shop">
              <div class="logo"><img src="${store.logoUrl}" alt="${store.name} logo" loading="eager" decoding="async" /></div>
              <div>
                <h1>${store.name}</h1>
                <p class="meta">店铺详情 · 活动可选</p>
              </div>
              <div class="distance">附近<br />可选购</div>
            </div>
            <p class="desc">${store.name} 当前展示 ${productNames(store, 6)}。你可以先对比口味和原价，再结合 ￥0.1 选择想喝的单品。</p>
            <p class="section-title">热门产品</p>
            <div class="goods">${productGrid(store)}</div>
            <button class="action" type="button">进店选购</button>
          </article>
          <p class="copy">如果想喝清爽型，优先看果茶、柠檬茶、轻乳茶；如果想喝浓郁型，优先看鲜奶茶、厚乳、芋泥、烧仙草和波波类。</p>
          <p class="copy">AI 建议：先选一杯价格差明显、口味接受度高的招牌款，再看是否需要加料或换成大杯。</p>
        `;

        content.querySelector(".back").addEventListener("click", () => renderList(lastQuery));
      }

      composerInput.addEventListener("focus", () => bottomShell.classList.add("is-typing"));
      composerInput.addEventListener("blur", () => bottomShell.classList.add("is-typing"));
      composerInput.addEventListener("input", () => {
        clearTimeout(inputTimer);
        const value = composerInput.value.trim();
        if (value.length >= 1) {
          inputTimer = setTimeout(() => showTeaResults(value), 520);
        }
      });
      composerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        showTeaResults(composerInput.value);
      });

      renderWelcome();
    </script>
  </body>
</html>
